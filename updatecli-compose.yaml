name: Default Update Policies

values:
  - updatecli/values.d/scm.yaml

policies:
  - name: Local Policies
    id: local
    config:
      - updatecli/updatecli.d/

  - name: Update Updatecli policies
    policy: ghcr.io/updatecli/policies/updatecli/autodiscovery:0.9.0@sha256:67026697434a99f6e01a662caa662e8ed02e39e8abf8f7399ab673d113abb360
    valuesinline:
      pipeline:
        labels:
          ecosystem: "updatecli"
          monitor: active

  - name: Handle Updatecli version in GitHub action
    policy: ghcr.io/updatecli/policies/updatecli/githubaction:0.10.0@sha256:666a807c7e1f260fa3d9357fd2b60c57f5dedbd6f29f97b6f82d882ed4058608
    valuesinline:
      pipeline:
        labels:
          ecosystem: "updatecli"
          monitor: active

  - name: NPM autodiscovery
    policy: ghcr.io/updatecli/policies/npm/autodiscovery:0.13.0@sha256:a6ae41383d6e0ebd8a139b44f441134b9a6e881aa30393e1298529d73df27d83
    valuesinline:
      automerge: true
      groupby: individual
      spec:
        ignoreversionconstraints: true
        # Bundled in dist/, handled by updatecli/updatecli.d/npm-dist.yaml
        ignore:
          - packages:
              "@actions/core": ""
              "@actions/exec": ""
              "@actions/io": ""
              "@actions/tool-cache": ""
              "@vercel/ncc": ""

  - name: Handle Nodejs version in githubaction
    policy: ghcr.io/updatecli/policies/nodejs/githubaction:0.12.0@sha256:9bd7725a2f31dc104bb8086458febb7fce9d66347dff560ba3d45053d97d9b19
    valuesinline:
      versionpattern: "~24"
      automerge: true

  - name: Handle GitHub action version update
    policy: ghcr.io/updatecli/policies/autodiscovery/githubaction:0.5.0@sha256:7dd97c132950994dc3fb89e0bc77037358e9168d8e6980705b2a06e444270626

  - name: Configure Updatecli workflows
    id: updatecli
    policy: ghcr.io/updatecli/policies/updatecli/githubaction/scaffold:0.2.0@sha256:abfecc050f1598f0ee835d673ddc06c89f71319c64672486e608d6f47f0d8987
    valuesinline:
      gha:
        npm:
          enabled: true
        udash:
          enabled: true
        update:
          cron: "0 3 * * *"
          matrix:
            - target_name: "existing pipelines"
              apply_args: "--existing-only=true"
            - target_name: "monitored pipelines"
              apply_args: "--labels=monitor:active"
      pipeline:
        labels:
          ecosystem: "updatecli"
          policy: scaffold
          monitor: active
